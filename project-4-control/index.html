<!doctype html>
<html>
    <head>
        <title>DRESS ME UP</title>
        <link rel="stylesheet" href="main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/Asset 1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Rammetto+One&display=swap" rel="stylesheet">


    </head>
    <body>
        <h1 class="header jua-regular">DRESS ME UP PLEASE</h1>

        <div class="container">

            <!--LEFT PAD START-->
            <div class="left">

                <h1 class="rammetto-one-regular">ACCESORIES</h1>
                <div class="accessories">
                    <div class="accessory-1 draggable"></div>
                    <div class="accessory-2 draggable"></div>
                    <div class="accessory-3 draggable"></div>


                </div>

                <h1 class="rammetto-one-regular">SHOES</h1>

                <div class="shoes">
                    <div class="shoes-1 draggable"></div>
                    <div class="shoes-2 draggable"></div>
                    <div class="shoes-3 draggable"></div>


                </div>

            </div>
            <!--LEFT PAD END-->







            <!--CENTER PAD START-->
            <div class="center">
                <p class="intro jua-regular">I HAVE CLASS IN 10 MINUTES <br>
                AND I DON'T KNOW WHAT TO WEAR</p>
                <div class="doll"></div>
                
                <div>
                <button class="reset jua-regular" onClick="window.location.reload()">Put Clothes Away</button>
            </div>


            </div>
            <!--CENTER PAD END-->





            <!--RIGHT PAD START-->
            <div class="right">

                <h1 class="rammetto-one-regular">BOTTOMS</h1>
                
                <div class="bottoms">
                    <div class="bottom-1 draggable"></div>
                    <div class="bottom-2 draggable"></div>
                    <div class="bottom-3 draggable"></div>


                </div>

                <h1 class="rammetto-one-regular">TOPS</h1>
                <div class="tops">
                    <div class="top-1 draggable"></div>
                    <div class="top-2 draggable"></div>
                    <div class="top-3 draggable"></div>


                </div>



            </div>
            <!--RIGHT PAD END-->
        </div>

        <script src="jquery-3.7.1.min.js"></script>
        <script src="jquery-ui.min.js"></script>
        <script src="main.js"></script>

    </body>
</html>
